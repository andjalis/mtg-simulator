<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Ranked Ladder</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e0da;
  --accent: #3b5bdb; --accent-text: #ffffff; --good: #2b8a3e; --bad: #c92a2a; --warn: #b26a00;
  --track: #ecebe6; --bar: #3b5bdb; --ci: rgba(59, 91, 219, .25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --panel: #1d1d20; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
    --accent: #7b93ff; --accent-text: #0e0e10; --good: #69db7c; --bad: #ff8787; --warn: #ffc078;
    --track: #2a2a2f; --bar: #7b93ff; --ci: rgba(123, 147, 255, .3);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
label.h { display: block; font-weight: 600; margin: 14px 0 6px; }
label.h:first-child { margin-top: 0; }
textarea, input[type=text], input[type=number] { width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
textarea { height: 260px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.tiers label { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; cursor: pointer; }
.tiers small { color: var(--muted); }
.check { margin-top: 8px; font-size: 13px; color: var(--muted); }
.check .err { color: var(--bad); }
.check .warn { color: var(--warn); }
.check details { margin-top: 4px; }
.check li { margin: 2px 0; }
button.go { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; font: inherit;
  font-weight: 600; background: var(--accent); color: var(--accent-text); cursor: pointer; }
button.go:disabled { opacity: .5; cursor: default; }
.opt { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; }
.empty { color: var(--muted); }
.progress { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
.progress div { height: 100%; background: var(--bar); width: 0; transition: width .3s; }
.verdict { font-size: 18px; font-weight: 600; margin: 4px 0 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.tier { cursor: pointer; font-weight: 600; }
tr.tier td:first-child::before { content: "▸ "; color: var(--muted); }
tr.tier.open td:first-child::before { content: "▾ "; }
tr.opp td { font-weight: 400; color: var(--text); }
tr.opp td:first-child { padding-left: 22px; }
.meter { position: relative; height: 10px; background: var(--track); border-radius: 5px; min-width: 90px; }
.meter .ci { position: absolute; top: 0; bottom: 0; background: var(--ci); border-radius: 5px; }
.meter .pt { position: absolute; top: -2px; width: 3px; height: 14px; background: var(--bar); border-radius: 1px; }
.meter .pass { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.ok { color: var(--good); } .no { color: var(--bad); }
.note { color: var(--muted); font-size: 13px; margin-top: 12px; }
.scroll { overflow-x: auto; }
#rank { margin: -16px -16px 16px; border-bottom: 1px solid var(--line); }
#rank .mmr { border-radius: 10px 10px 0 0; }
#grades { margin: 0 0 16px; }
</style>
</head>
<body>
<main>
  <nav style="float:right;font-size:14px;margin-top:8px"><a href="/leaderboard">Leaderboard</a></nav>
  <h1>MTG ranked ladder</h1>
  <p class="sub">Paste a decklist, choose ranks, and see how it fares against the test decks in the built-in engine.</p>
  <div class="grid">
    <section class="panel">
      <label class="h" for="name">Deck name</label>
      <input id="name" type="text" placeholder="my deck">
      <label class="h" for="deck">Decklist</label>
      <textarea id="deck" spellcheck="false" placeholder="4 Lightning Bolt&#10;4 Monastery Swiftspear&#10;20 Mountain&#10;..."></textarea>
      <div class="check" id="check"></div>

      <label class="h">Mode</label>
      <div class="seg" id="mode">
        <button data-mode="ladder" class="on">Full climb</button>
        <button data-mode="tiers">Chosen ranks</button>
      </div>
      <div id="ladderOpts">
        <label class="opt"><input type="checkbox" id="full"> Keep going after a failed rank</label>
      </div>
      <div class="tiers" id="tierList" hidden></div>

      <label class="h" for="games">Games per opponent</label>
      <input id="games" type="number" min="2" step="2" value="100">
      <label class="opt"><input type="checkbox" id="grade" checked> Grade the deck: meta, mana, speed, consistency</label>
      <button class="go" id="go" disabled>Run</button>
    </section>

    <section class="panel" id="out">
      <p class="empty">Results appear here. The full climb plays each rank from the lowest up and stops at the first rank
        where the deck wins less than <span id="passRate">50%</span> of its games.</p>
    </section>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const pct = x => x == null ? "–" : (100 * x).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let mode = "ladder", passRate = 0.5, checkOk = false, checkTimer, polling;

try { $("#deck").value = localStorage.getItem("mtgsim.deck") || ""; $("#name").value = localStorage.getItem("mtgsim.name") || ""; } catch (e) {}

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

api("/api/tiers").then(d => {
  passRate = d.pass_rate;
  $("#passRate").textContent = pct(passRate).replace(".0%", "%");
  $("#games").max = d.max_games;
  $("#tierList").innerHTML = d.tiers.map((t, i) =>
    `<label title="${esc(t.decks.join(", "))}"><input type="checkbox" value="${t.key}"${i === d.tiers.length - 1 ? "" : " checked"}>
     <span>${i + 1}. ${esc(t.label)} <small>${t.decks.length} decks · ${esc(t.about)}</small></span></label>`).join("");
});

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b));
  $("#tierList").hidden = mode !== "tiers";
  $("#ladderOpts").hidden = mode !== "ladder";
});

function scheduleCheck() {
  clearTimeout(checkTimer);
  checkOk = false; $("#go").disabled = true;
  try { localStorage.setItem("mtgsim.deck", $("#deck").value); localStorage.setItem("mtgsim.name", $("#name").value); } catch (e) {}
  if (!$("#deck").value.trim()) { $("#check").innerHTML = ""; return; }
  $("#check").textContent = "Checking cards…";
  checkTimer = setTimeout(runCheck, 500);
}
async function runCheck() {
  try {
    const c = await api("/api/check", {deck: $("#deck").value});
    let html = `${c.cards} cards, ${c.distinct} different.`;
    if (c.cards && c.cards < 60) html += ` <span class="warn">Fewer than 60 cards.</span>`;
    if (c.error) html += `<div class="err">${esc(c.error)}</div>`;
    if (c.partial && c.partial.length) {
      html += `<details><summary class="warn">${c.partial.length} card${c.partial.length > 1 ? "s" : ""} only partly simulated</summary><ul>` +
        c.partial.map(p => `<li><b>${esc(p.name)}</b>: ignores ${esc(p.ignored.join(" | "))}</li>`).join("") +
        `</ul></details>`;
    }
    $("#check").innerHTML = html;
    checkOk = !c.error;
  } catch (e) {
    $("#check").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
  $("#go").disabled = !checkOk || !!polling;
}
$("#deck").addEventListener("input", scheduleCheck);
$("#name").addEventListener("input", () => { try { localStorage.setItem("mtgsim.name", $("#name").value); } catch (e) {} });
if ($("#deck").value.trim()) scheduleCheck();

$("#go").onclick = async () => {
  const body = {deck: $("#deck").value, name: $("#name").value, games: +$("#games").value,
                ladder: mode === "ladder", full: $("#full").checked, grade: $("#grade").checked};
  if (mode === "tiers") {
    body.tiers = [...document.querySelectorAll("#tierList input:checked")].map(i => i.value);
    if (!body.tiers.length) { $("#out").innerHTML = `<p class="no">Pick at least one rank.</p>`; return; }
  }
  $("#go").disabled = true;
  try {
    const {id} = await api("/api/run", body);
    poll(id);
  } catch (e) {
    $("#out").innerHTML = `<p class="no">${esc(e.message)}</p>`;
    $("#go").disabled = !checkOk;
  }
};

const open = new Set();
function poll(id) {
  polling = true;
  const tick = async () => {
    let s;
    try { s = await api("/api/runs/" + id); } catch (e) { $("#out").innerHTML = `<p class="no">${esc(e.message)}</p>`; polling = false; $("#go").disabled = !checkOk; return; }
    render(s);
    if (s.status === "queued" || s.status === "running") setTimeout(tick, 700);
    else { polling = false; $("#go").disabled = !checkOk; }
  };
  tick();
}

function meter(r) {
  if (r.rate == null) return "";
  const pos = x => (100 * x).toFixed(1) + "%";
  return `<div class="meter" title="95% CI ${pct(r.lo)} to ${pct(r.hi)}">
    <div class="ci" style="left:${pos(r.lo)};width:${pos(r.hi - r.lo)}"></div>
    <div class="pass" style="left:${pos(passRate)}"></div>
    <div class="pt" style="left:calc(${pos(r.rate)} - 1px)"></div></div>`;
}

// Slot for the ranked-ladder view (Bronze to Grandmaster). When the run snapshot carries a
// `rank` object, this fills #rank above the rank table; until then it stays hidden.
function renderRank(s) {
  const el = $("#rank");
  if (!el || !s.rank) return;
  el.hidden = false;
  el.innerHTML = s.rank.html;
  el.querySelectorAll("script").forEach(old => {  // innerHTML doesn't run scripts (the chart's tooltips)
    const js = document.createElement("script");
    js.textContent = old.textContent;
    old.replaceWith(js);
  });
}

function render(s) {
  let h = "";
  if (s.status === "queued") h += `<p class="empty">Waiting for the previous run to finish…</p>`;
  if (s.status === "running" || s.status === "queued") {
    const frac = s.total ? s.done / s.total : 0;
    h += `<div>Playing ${esc(s.current || "…")}: ${s.done} of ${s.total} games</div>
          <div class="progress"><div style="width:${(100 * frac).toFixed(1)}%"></div></div>`;
  }
  if (s.status === "error") h += `<p class="no">The run failed: ${esc(s.error)}</p>`;
  if (s.assessment) h += `<div id="grades">${s.assessment.html}</div>`;  // grade cards, with the meta caveat
  else if (s.grade_error) h += `<p class="note">The deck could not be graded: ${esc(s.grade_error)}</p>`;
  if (s.verdict && !s.rank) h += `<div class="verdict">${esc(s.verdict)}</div>`;  // the rank view shows it already
  else if (s.status === "done") h += `<div class="verdict">${esc(s.deck)} by rank</div>`;
  if (s.tiers.length) {
    h += `<div class="scroll"><table><thead><tr><th>Rank / opponent</th><th class="num">Win rate</th><th>95% CI (line = ${pct(s.pass_rate).replace(".0%", "%")} to clear)</th>
          <th class="num">W–L–D</th><th class="num">Play / draw</th><th class="num">Turns</th>${s.ladder ? "<th></th>" : ""}</tr></thead><tbody>`;
    for (const t of s.tiers) {
      const isOpen = open.has(t.key);
      const w = t.opponents.reduce((a, o) => [a[0] + o.wins, a[1] + o.losses, a[2] + o.draws], [0, 0, 0]);
      h += `<tr class="tier${isOpen ? " open" : ""}" data-key="${t.key}"><td>${esc(t.label)}</td><td class="num">${pct(t.rate)}</td>
            <td>${meter(t)}</td><td class="num">${w.join("–")}</td><td></td><td></td>
            ${s.ladder ? `<td class="${t.cleared ? "ok" : "no"}">${t.cleared ? "cleared" : "failed"}</td>` : ""}</tr>`;
      if (isOpen) for (const o of t.opponents) {
        h += `<tr class="opp"><td>${esc(o.name)}</td><td class="num">${pct(o.rate)}</td><td>${meter(o)}</td>
              <td class="num">${o.wins}–${o.losses}–${o.draws}</td><td class="num">${o.on_play} · ${o.on_draw}</td>
              <td class="num">${o.avg_turns == null ? "–" : o.avg_turns.toFixed(1)}</td>${s.ladder ? "<td></td>" : ""}</tr>`;
      }
    }
    h += `</tbody></table></div><p class="note">Click a rank to see each opponent. Draws count as half a win.
          ${s.games_per_opponent} games per opponent; play / draw shows wins on the play · on the draw.</p>`;
  }
  if (s.partial && s.partial.length)
    h += `<p class="note">${s.partial.length === 1 ? "One of your cards is" : s.partial.length + " of your cards are"} only partly simulated, so treat these numbers with care.
          The top rank in particular uses cards the built-in engine handles only in part.</p>`;
  $("#out").innerHTML = `<div id="rank" hidden></div>` + (h || `<p class="empty">Starting…</p>`);
  renderRank(s);
  $("#out").querySelectorAll("tr.tier").forEach(tr => tr.onclick = () => {
    open.has(tr.dataset.key) ? open.delete(tr.dataset.key) : open.add(tr.dataset.key);
    render(s);
  });
}
</script>
</body>
</html>
