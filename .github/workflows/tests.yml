name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The card database is ~27 MB and not committed. Cache it per week and per
      # version of the builder, so new cards arrive weekly and builder changes rebuild it.
      - name: Cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache card database
        id: carddb
        uses: actions/cache@v6
        with:
          path: mtgsim/data/cards.sqlite3
          key: carddb-${{ hashFiles('mtgsim/build_carddb.py') }}-${{ steps.week.outputs.week }}

      - name: Build card database
        if: steps.carddb.outputs.cache-hit != 'true'
        run: python3 -m mtgsim.build_carddb

      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # pyflakes is a CI-only tool; the simulator itself stays standard library only.
      - name: Install pyflakes
        run: python3 -m pip install pyflakes==4.0.3

      - name: Run pyflakes
        run: python3 scripts/lint.py

  parse-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache card database
        id: carddb
        uses: actions/cache@v6
        with:
          path: mtgsim/data/cards.sqlite3
          key: carddb-${{ hashFiles('mtgsim/build_carddb.py') }}-${{ steps.week.outputs.week }}

      - name: Build card database
        if: steps.carddb.outputs.cache-hit != 'true'
        run: python3 -m mtgsim.build_carddb

      # Parse every card with the base branch's code and with this PR's, and list what changed.
      # Fails only when a card that parsed before now raises.
      - name: Compare card parsing with the base branch
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          PYTHONPATH=../base python3 scripts/parse_diff.py dump ../base.tsv
          python3 scripts/parse_diff.py dump ../head.tsv
          python3 scripts/parse_diff.py compare ../base.tsv ../head.tsv --report ../report.md

      # Keep one comment on the PR with the changed cards, updated on each push. No comment is
      # added while nothing changed. Fork PRs get a read-only token, so this step may not post.
      - name: Comment the changed cards on the PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f ../report.md ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- parse-diff -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@../report.md > /dev/null
          elif ! grep -q ": 0 of " ../report.md; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file ../report.md
          fi
